<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.min.css" />
    <link rel="stylesheet" href="/vendor/codemirror/addon/dialog/dialog.min.css" />
    <!-- Vendored Tabler outline icon webfont (MIT): `ti ti-*` classes. -->
    <link rel="stylesheet" href="/vendor/icons/tabler-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearth</title>
    <!-- Vendored highlight.js browser bundle exposes global `hljs`. -->
    <script src="/vendor/highlight.min.js"></script>
    <!-- Vendored CodeMirror 5 (global `CodeMirror`): live syntax highlighting + VIM
         in the study answer editor. Core → modes (xml/js/css before htmlmixed) →
         addons → vim keymap. -->
    <script src="/vendor/codemirror/lib/codemirror.min.js"></script>
    <script src="/vendor/codemirror/mode/xml/xml.min.js"></script>
    <script src="/vendor/codemirror/mode/javascript/javascript.min.js"></script>
    <script src="/vendor/codemirror/mode/css/css.min.js"></script>
    <script src="/vendor/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="/vendor/codemirror/mode/clike/clike.min.js"></script>
    <script src="/vendor/codemirror/mode/python/python.min.js"></script>
    <script src="/vendor/codemirror/mode/rust/rust.min.js"></script>
    <script src="/vendor/codemirror/mode/go/go.min.js"></script>
    <script src="/vendor/codemirror/mode/ruby/ruby.min.js"></script>
    <script src="/vendor/codemirror/mode/php/php.min.js"></script>
    <script src="/vendor/codemirror/mode/sql/sql.min.js"></script>
    <script src="/vendor/codemirror/mode/shell/shell.min.js"></script>
    <script src="/vendor/codemirror/mode/yaml/yaml.min.js"></script>
    <script src="/vendor/codemirror/mode/markdown/markdown.min.js"></script>
    <script src="/vendor/codemirror/mode/dockerfile/dockerfile.min.js"></script>
    <script src="/vendor/codemirror/mode/lua/lua.min.js"></script>
    <script src="/vendor/codemirror/mode/perl/perl.min.js"></script>
    <script src="/vendor/codemirror/mode/haskell/haskell.min.js"></script>
    <script src="/vendor/codemirror/mode/swift/swift.min.js"></script>
    <script src="/vendor/codemirror/mode/powershell/powershell.min.js"></script>
    <script src="/vendor/codemirror/mode/toml/toml.min.js"></script>
    <script src="/vendor/codemirror/mode/r/r.min.js"></script>
    <script src="/vendor/codemirror/addon/search/searchcursor.min.js"></script>
    <script src="/vendor/codemirror/addon/dialog/dialog.min.js"></script>
    <script src="/vendor/codemirror/addon/display/placeholder.min.js"></script>
    <script src="/vendor/codemirror/keymap/vim.min.js"></script>
    <!-- Vendored Cytoscape.js (MIT, global `cytoscape`): the Playbook node-graph view. -->
    <script src="/vendor/cytoscape/cytoscape.min.js"></script>
    <script type="module" src="/main.js"></script>
  </head>

  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand"><i class="ti ti-flame" aria-hidden="true"></i>Hearth</div>
        <button id="update-badge" class="update-badge" hidden>● Update available</button>
        <div class="deck-switch">
          <label for="deck-switcher">Filter</label>
          <select id="deck-switcher" title="Filter the Library by deck — decks organize your cards but never hide them"></select>
        </div>
        <nav>
          <button data-view="dashboard"><i class="ti ti-home" aria-hidden="true"></i>Dashboard</button>
          <button data-view="library"><i class="ti ti-book" aria-hidden="true"></i>Library</button>
          <button data-view="study"><i class="ti ti-player-play" aria-hidden="true"></i>Study</button>
          <button data-view="playbooks"><i class="ti ti-list-check" aria-hidden="true"></i>Playbooks</button>
          <button data-view="stats"><i class="ti ti-chart-bar" aria-hidden="true"></i>Stats</button>
          <button data-view="tags"><i class="ti ti-tag" aria-hidden="true"></i>Tags</button>
          <button data-view="settings"><i class="ti ti-settings" aria-hidden="true"></i>Settings</button>
        </nav>
        <div class="sidebar-spacer"></div>
        <button id="new-shard" class="btn btn-primary"><i class="ti ti-plus" aria-hidden="true"></i>New Shard</button>
      </aside>
      <main id="view"></main>
    </div>
    <div id="modal-root"></div>
  </body>
</html>
