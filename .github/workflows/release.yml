name: Release

# Builds platform-native installers on each OS and publishes them to a GitHub
# Release. Trigger by pushing a version tag (e.g. `git tag v0.2.0 && git push
# origin v0.2.0`), or run manually from the Actions tab.
#
# The Tauri project lives in the nested `Bonfire/` folder, so `projectPath` points
# there. Builds are UNSIGNED for now (users see a one-time "unknown developer"
# warning). See SETUP-GITHUB-RELEASES.txt in the repo root.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write # allow the job to create the Release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      # Installs @tauri-apps/cli so `npm run tauri build` can find the `tauri`
      # binary (the missing piece behind the exit-127 "command not found").
      - name: Install frontend dependencies
        run: npm install
        working-directory: ./Bonfire

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./Bonfire/src-tauri -> target"

      # No frontend *build*: the UI is static files in Bonfire/src and the
      # vendored libs (highlight.js, CodeMirror) are committed. The npm install
      # above only provides the @tauri-apps/cli, then tauri-action runs `tauri build`.
      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Bonfire
          tagName: ${{ github.ref_name }}
          releaseName: "Bonfire ${{ github.ref_name }}"
          releaseBody: "Download the installer for your OS below. Builds are unsigned, so Windows SmartScreen / macOS Gatekeeper may show a one-time \"unknown developer\" warning."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
